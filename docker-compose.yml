services:
  app:
    image: ghcr.io/jonathanaspeling/piles:latest
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "true"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: /data/database.sqlite
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      CACHE_STORE: ${CACHE_STORE:-database}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: ${REVERB_HOST}
      REVERB_PORT: ${REVERB_PORT:-443}
      REVERB_SCHEME: ${REVERB_SCHEME:-https}
    volumes:
      - piles-db:/data
      - piles-storage:/app/storage
    expose:
      - "80"
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisord.conf"]
    healthcheck:
      # Exercises the whole request path — nginx, php-fpm, and Laravel booting
      # far enough to answer the /up health route.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous: this is the container that runs migrations on boot.
      start_period: 90s

  queue:
    image: ghcr.io/jonathanaspeling/piles:latest
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "false"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: /data/database.sqlite
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: ${REVERB_HOST}
      REVERB_PORT: ${REVERB_PORT:-443}
      REVERB_SCHEME: ${REVERB_SCHEME:-https}
    volumes:
      - piles-db:/data
      - piles-storage:/app/storage
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    healthcheck:
      # Exec form, deliberately not CMD-SHELL: a shell wrapper carries the
      # pattern in its own cmdline, which `pgrep -f` then matches, so the
      # check passes even when no worker is running.
      test: ["CMD", "pgrep", "-f", "artisan queue:work"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    image: ghcr.io/jonathanaspeling/piles:latest
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "false"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: /data/database.sqlite
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: ${REVERB_HOST}
      REVERB_PORT: ${REVERB_PORT:-443}
      REVERB_SCHEME: ${REVERB_SCHEME:-https}
    volumes:
      - piles-db:/data
      - piles-storage:/app/storage
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "artisan schedule:work"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  reverb:
    image: ghcr.io/jonathanaspeling/piles:latest
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "false"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: /data/database.sqlite
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: ${REVERB_HOST}
      REVERB_PORT: ${REVERB_PORT:-443}
      REVERB_SCHEME: ${REVERB_SCHEME:-https}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    volumes:
      - piles-db:/data
      - piles-storage:/app/storage
    expose:
      - "8080"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      # Reverb serves its own /up route on the websocket port, so this proves
      # the server is accepting connections rather than merely still running.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  piles-db:
  piles-storage:
